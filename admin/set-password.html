<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Passage No 199 | Şifre oluştur</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101010;color:#f5f0e8;font-family:Arial,sans-serif}main{text-align:center;padding:24px;max-width:360px}h1{margin:0 0 10px;font-size:28px}p{margin:0;color:#c9c2b8;line-height:1.5}button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#d7a642;color:#16120b;font:inherit;font-weight:700;cursor:pointer}</style>
</head>
<body>
<main><h1>Yönetici şifreni oluştur</h1><p>Şifre ekranı açılmazsa aşağıdaki düğmeye bir kez bas.</p><button type="button" id="retry-password">Şifre ekranını yeniden yükle</button></main>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
var recoveryHash=window.location.hash;
window.netlifyIdentity.on('login',function(){window.netlifyIdentity.close();window.location.replace('/admin/')});
window.netlifyIdentity.init();
document.getElementById('retry-password').addEventListener('click',function(){window.location.replace('/admin/set-password.html'+recoveryHash)});
</script>
</body>
</html>
