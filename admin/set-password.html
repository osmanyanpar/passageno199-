<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Passage No 199 | Yönetici şifresi</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101010;color:#f5f0e8;font-family:Arial,sans-serif}main{box-sizing:border-box;width:min(100%,420px);padding:28px 24px}h1{margin:0 0 10px;font-size:28px}p{color:#c9c2b8;line-height:1.5}label{display:block;margin:18px 0 7px;font-weight:700}input,button{box-sizing:border-box;width:100%;font:inherit}input{padding:13px;border:1px solid #5c564d;border-radius:8px;background:#1d1b19;color:inherit}button{margin-top:22px;padding:13px;border:0;border-radius:8px;background:#d7a642;color:#16120b;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#message{min-height:24px;margin:16px 0 0}.error{color:#ff9a91}.success{color:#b6e39b}</style>
</head>
<body>
<main>
<h1>Yönetici şifreni oluştur</h1>
<p>Yeni şifreni belirle. Bu işlem aynı sayfada tamamlanır.</p>
<form id="password-form">
<label for="password">Yeni şifre</label>
<input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" />
<label for="password-confirm">Şifre tekrar</label>
<input id="password-confirm" name="password-confirm" type="password" minlength="8" required autocomplete="new-password" />
<button type="submit">Şifreyi kaydet</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script>
(function(){
var hash=new URLSearchParams(window.location.hash.slice(1));
var recoveryToken=hash.get('recovery_token');
var inviteToken=hash.get('invite_token');
var token=recoveryToken||inviteToken;
var type=recoveryToken?'recovery':'invite';
var form=document.getElementById('password-form');
var message=document.getElementById('message');
var button=form.querySelector('button');
function show(text,kind){message.textContent=text;message.className=kind||''}
if(!token){form.hidden=true;show('Bu bağlantı geçerli bir şifre oluşturma anahtarı içermiyor. En yeni e-postadaki bağlantıyı aç.','error');return}
form.addEventListener('submit',async function(event){
event.preventDefault();
var password=document.getElementById('password').value;
var confirm=document.getElementById('password-confirm').value;
if(password!==confirm){show('Şifreler aynı değil. Tekrar kontrol et.','error');return}
button.disabled=true;show('Şifre kaydediliyor…');
try{
var response=await fetch('/.netlify/identity/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:password,type:type})});
if(!response.ok)throw new Error('Şifre kaydedilemedi. Bağlantının süresi dolmuş olabilir.');
show('Şifre kaydedildi. Yönetim ekranına yönlendiriliyorsun…','success');
window.setTimeout(function(){window.location.replace('/admin/')},900);
}catch(error){show(error.message||'Şifre kaydedilemedi. Yeni bir bağlantı iste.','error');button.disabled=false}
});
}());
</script>
</body>
</html>
