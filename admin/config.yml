backend:
  name: git-gateway
  branch: main
locale: tr
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  - name: "site"
    label: "Site İçeriği"
    files:
      - label: "Haftalık Program"
        name: "program"
        file: "content/program.json"
        format: "json"
        fields:
          - label: "Etkinlikler"
            name: "shows"
            widget: list
            fields:
              - { label: "Gün", name: "day", widget: string }
              - { label: "Gün kısaltması", name: "short", widget: string }
              - { label: "Sanatçı", name: "artist", widget: string }
              - { label: "Açıklama", name: "note", widget: string, required: false }
      - label: "Özel Etkinlikler"
        name: "special_events"
        file: "content/special-events.json"
        format: "json"
        fields:
          - label: "Etkinlikler"
            name: "events"
            widget: list
            fields:
              - { label: "Tarih", name: "date", widget: string }
              - { label: "Sanatçı", name: "artist", widget: string }
              - { label: "Açıklama", name: "description", widget: string, required: false }
              - { label: "Video dosyası", name: "video", widget: file }
              - { label: "Rezervasyon bağlantısı", name: "reservationLink", widget: string, default: "#rezervasyon" }
              - { label: "Yayında", name: "active", widget: boolean, default: true }
  - name: "menus"
    label: "Menüler"
    files:
      - label: "Menü Fiyatları"
        name: "menu_prices"
        file: "content/menu.json"
        format: "json"
        fields:
          - label: "Kategoriler"
            name: "categories"
            widget: list
            fields:
              - { label: "Kategori", name: "title", widget: string }
              - { label: "Alt başlık", name: "subtitle", widget: string, required: false }
              - { label: "Bölüm bağlantısı", name: "id", widget: string, required: false }
              - label: "Ürünler"
                name: "items"
                widget: list
                fields:
                  - { label: "Ürün", name: "name", widget: string }
                  - { label: "Fiyat", name: "price", widget: string }
                  - { label: "Açıklama", name: "description", widget: text, required: false }
  - name: "contact"
    label: "İletişim"
    files:
      - label: "Rezervasyon ve iletişim"
        name: "contact"
        file: "content/contact.yml"
        fields:
          - { label: "Telefon", name: "phone", widget: string }
          - { label: "WhatsApp", name: "whatsapp", widget: string }
          - { label: "Instagram", name: "instagram", widget: string, required: false }
