<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passage No 199 | Şifre oluştur</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101010; color: #f5f0e8; font-family: Arial, sans-serif; }
      main { text-align: center; padding: 24px; }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { margin: 0; color: #c9c2b8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Yönetici şifreni oluştur</h1>
      <p>Açılan pencereden yeni şifreni belirle.</p>
    </main>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      window.netlifyIdentity.on('login', function () {
        window.netlifyIdentity.close();
        window.location.replace('/admin/');
      });
      window.netlifyIdentity.init();
    </script>
  </body>
</html>
